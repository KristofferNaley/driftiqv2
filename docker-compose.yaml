# DriftIQ v2 — Next.js + Better Auth. Eget prosjekt, egen historikk, egen database.
#
# Kjører side om side med v1s test (3005/3006/8001) og prod (3002/3003/8000), og deler
# ingenting med dem utover den sentrale Postgres-serveren.
#
#   docker compose up -d --build
#
# Databasen er IKKE en del av stacken. Den ligger på vertens sentrale Postgres 17, som nås
# som verten «postgres» på det eksterne `edge`-nettet. Se README, «Første gang».
services:
  app:
    build: .
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Egen approlle: den sentrale Postgres-serveren er delt mellom miljøer, og roller er
      # cluster-vide. Uten eget navn ville v2 og v1-test kjempet om samme rolles passord ved
      # hver oppstart — samme grunn som `driftiq_test_app` i v1.
      APP_DB_USER: ${APP_DB_USER:-driftiq_v2_app}
      # I motsetning til v1 er denne PÅKREVD — appen nekter å starte uten den, i stedet for
      # å falle tilbake til eierrollen med en advarsel. Se kommentaren i src/db/client.ts.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3008}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      UPLOAD_DIR: /app/uploads
      # Utgående e-post. Tom nøkkel = ingen sending, og appen kjører videre.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-DriftIQ <noreply@driftiq.no>}
      BASE_URL: ${BASE_URL:-http://localhost:3008}
      # Domenevakt — se .env.example. MÅ settes i test.
      EPOST_TILLATTE_DOMENER: ${EPOST_TILLATTE_DOMENER:-}
      # Hvem som varsles om nye henvendelser fra landingssiden. Er den tom, lagres leaden
      # fortsatt — men det logges HØYT, for en lead ingen vet om er en tapt kunde.
      LEADS_NOTIFY_EMAIL: ${LEADS_NOTIFY_EMAIL:-}
      # AI-rådgiveren. Tom nøkkel = endepunktet svarer 503, resten av appen kjører videre.
      # Nøkkelen hentes fra console.anthropic.com; se .env.example.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Kursen som brukes til å vise AI-forbruk i kroner. Anthropic fakturerer i USD, og
      # dette er kun et ESTIMAT for panelet — fasit er fakturaen. Se src/lib/ai.ts.
      USD_TIL_NOK: ${USD_TIL_NOK:-11.0}
      # Vertsdeling. Er de tomme, serverer appen ALT på én vert — det er hvordan lokal
      # utvikling og tilgang via IP fungerer. Se src/middleware.ts.
      VERT_APP: ${VERT_APP:-}
      VERT_ADMIN: ${VERT_ADMIN:-}
      VERT_MARKED: ${VERT_MARKED:-}
    ports:
      - "3008:3008"
    volumes:
      # Filene må overleve at containeren bygges på nytt.
      - uploads:/app/uploads
    networks:
      default:
      edge:

volumes:
  uploads:

# Nettet opprettes én gang per maskin med:  docker network create edge
networks:
  edge:
    external: true
